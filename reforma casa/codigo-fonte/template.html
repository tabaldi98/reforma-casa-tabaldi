<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casa 3D</title>
<style>
  :root {
    --bg: #e9edf1; --panel: rgba(255,255,255,.92); --text: #1f2328; --muted: #5d6670;
    --line: #d5dbe1; --accent: #2f6fb3; --accent-text: #fff; --seg: #eef1f4; --label-bg: rgba(255,255,255,.9);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1f24; --panel: rgba(28,32,38,.92); --text: #e8ebee; --muted: #9aa4ae;
      --line: #39414a; --accent: #5b9be0; --accent-text: #0d1620; --seg: #262c33; --label-bg: rgba(30,34,40,.9);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1f24; --panel: rgba(28,32,38,.92); --text: #e8ebee; --muted: #9aa4ae;
    --line: #39414a; --accent: #5b9be0; --accent-text: #0d1620; --seg: #262c33; --label-bg: rgba(30,34,40,.9);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #view { position: fixed; inset: 0; }
  #panel { position: fixed; top: 16px; left: 16px; width: 330px; max-width: calc(100vw - 32px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
    backdrop-filter: blur(6px); box-shadow: 0 6px 24px rgba(0,0,0,.12); z-index: 2; }
  h1 { font-size: 16px; margin: 0; }
  .sub { color: var(--muted); font-size: 12px; margin: 2px 0 12px; }
  .group { margin-bottom: 10px; }
  .glabel { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 4px; }
  .seg { display: flex; background: var(--seg); border-radius: 8px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--text); padding: 7px 6px;
    border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer; }
  .seg button.on { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .cams { display: flex; flex-wrap: wrap; gap: 4px; }
  .cams button, #export { border: 1px solid var(--line); background: transparent; color: var(--text);
    border-radius: 6px; padding: 5px 9px; font: inherit; font-size: 12px; cursor: pointer; }
  .cams button:hover, #export:hover { border-color: var(--accent); }
  .checks { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }
  .checks label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  #export { width: 100%; padding: 8px; margin-top: 2px; font-size: 13px; }
  #panel { max-height: calc(100vh - 32px); overflow-y: auto; }
  .paint-row { display: flex; align-items: center; gap: 8px; margin: 6px 0 4px; font-size: 13px; }
  .paint-row input[type=color] { width: 38px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; flex: none; }
  .paint-txt { flex: 1; min-width: 0; }
  .paint-row .hex { width: 84px; flex: none; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--text); padding: 5px 6px; font: 12px ui-monospace, Menlo, Consolas, monospace; text-transform: uppercase; }
  .paint-row .hex.bad { border-color: #d0453a; }
  .paint-row b { display: block; font-weight: 600; } .paint-row span { color: var(--muted); font-size: 12px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 5px; }
  .swatches button { width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(0,0,0,.25); padding: 0; cursor: pointer; }
  .swatches button.on { outline: 2px solid var(--accent); outline-offset: 2px; }
  .paint-actions { display: flex; gap: 6px; margin-top: 8px; }
  .paint-actions button { flex: 1; border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 6px; padding: 5px 6px; font: inherit; font-size: 12px; cursor: pointer; }
  .paint-actions button:hover { border-color: var(--accent); }
  #note { font-size: 12px; color: var(--muted); margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
  #toggle { display: none; }
  #hint { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--muted);
    background: var(--panel); padding: 5px 12px; border-radius: 20px; border: 1px solid var(--line); z-index: 2; white-space: nowrap; }
  .room { background: var(--label-bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 2px 7px; font-size: 11px; text-align: center; line-height: 1.25; pointer-events: none; white-space: nowrap; }
  .room b { display: block; font-size: 12px; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); z-index: 3; background: var(--bg); }
  @media (max-width: 600px) {
    #panel { top: 8px; left: 8px; right: 8px; width: auto; max-width: none; padding: 10px; }
    #panel.collapsed .body { display: none; }
    #toggle { display: block; position: absolute; top: 8px; right: 10px; border: 0; background: transparent; color: var(--accent); font: inherit; }
    .sub { margin-bottom: 8px; }
    #hint { display: none; }
  }
</style>

<body>
<div id="loading">Carregando o modelo…</div>
<div id="view"></div>
<div id="panel">
  <h1>Casa 3D · Projeto de reforma</h1>
  <div class="sub">Planta baixa A01-15 · casa 7,50 × 12,56 m · terreno 14 m de largura</div>
  <button id="toggle" aria-label="Mostrar ou esconder opções">opções</button>
  <div class="body">
    <div class="group">
      <div class="glabel">Projeto</div>
      <div class="seg" id="projSeg">
        <button data-v="atual">Atual</button>
        <button data-v="reforma" class="on">Reforma</button>
      </div>
    </div>
    <div class="group">
      <div class="glabel">Modelo</div>
      <div class="seg" id="modelSeg">
        <button data-v="1" class="on">1 · Limpo</button>
        <button data-v="2">2 · Com fotos</button>
      </div>
    </div>
    <div class="group">
      <div class="glabel">Visualização</div>
      <div class="seg" id="viewSeg">
        <button data-v="ext" class="on">Exterior</button>
        <button data-v="roof">Sem telhado</button>
        <button data-v="plan">Planta 3D</button>
      </div>
    </div>
    <div class="group">
      <div class="glabel">Câmera</div>
      <div class="cams">
        <button data-cam="iso">3/4 frente</button>
        <button data-cam="front">Frente</button>
        <button data-cam="back">Fundos</button>
        <button data-cam="left">Esquerda</button>
        <button data-cam="right">Direita</button>
        <button data-cam="top">Topo</button>
      </div>
    </div>
    <div class="group" id="paint">
      <div class="glabel">Cores da pintura</div>
      <div class="paint-row">
        <input type="color" id="pick-wall" aria-label="Cor da casa">
        <div class="paint-txt"><b>Casa</b><span id="name-wall"></span></div>
        <input type="text" class="hex" id="hex-wall" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Código hexadecimal" placeholder="#RRGGBB">
      </div>
      <div class="swatches" id="sw-wall"></div>
      <div class="paint-row">
        <input type="color" id="pick-trim" aria-label="Cor dos detalhes">
        <div class="paint-txt"><b title="Faixas da fachada, pilar e coberturas das janelas">Detalhes</b><span id="name-trim"></span></div>
        <input type="text" class="hex" id="hex-trim" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Código hexadecimal" placeholder="#RRGGBB">
      </div>
      <div class="swatches" id="sw-trim"></div>
      <div class="paint-actions"><button id="paintReset">Cores do projeto</button><button id="paintLink">Copiar link com estas cores</button></div>
    </div>
    <div class="group checks">
      <label><input type="checkbox" id="lot" checked> Terreno e muro</label>
      <label><input type="checkbox" id="labels" checked> Nomes dos cômodos</label>
    </div>
    <button id="export">Baixar modelo (.glb)</button>
    <div id="note"></div>
  </div>
</div>
<div id="hint">Arraste para girar · roda do mouse para zoom · botão direito para mover</div>

<script type="module">

// ---------------- Texturas procedurais
function rng(seed) { let s = seed % 2147483647; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

  porcelain: canvasTex(512, (g, n) => { speckle(g, n, '#e6e2d9', ['#ddd8ce', '#efebe4', '#d6d0c5'], 4000, 3, 71); blotches(g, n, '#cfc8bb', 10, 60, .15, 72);

  door: canvasTex(256, (g, n) => { g.fillStyle = '#f4f4f2'; g.fillRect(0, 0, n, n); g.fillStyle = '#d2d2ce';

  block: canvasTex(256, (g, n) => { speckle(g, n, '#a9a9a4', ['#9c9c97', '#b6b6b1'], 3000, 2, 91); g.fillStyle = '#86867f';

  plasterGray: canvasTex(512, (g, n) => { speckle(g, n, '#e6e6e6', ['#d6d6d6', '#f4f4f4', '#cdcdcd'], 9000, 2, 7); blotches(g, n, '#c6c6c6', 8, 60, .06, 3); }, 2.0),

const STD = (o) => new THREE.MeshStandardMaterial(o);

  porcelain: tiled(T.porcelain, { roughness: .35 }), terracotta: tiled(T.terracotta, { roughness: .8 }), fibro: tiled(T.fibro, { roughness: .8 }),
  door: tiled(T.door, { roughness: .5 }), block: tiled(T.block), gate: tiled(T.door, { roughness: .45, color: 0xeeeeec }),

  frame: STD({ color: 0xf0f0ed, roughness: .45 }), frameDark: STD({ color: 0x2c2d2f, roughness: .5 }),
  glass: STD({ color: 0x2f3e49, roughness: .06, metalness: .35, transparent: true, opacity: .78 }),
  frosted: STD({ color: 0xc6d0d3, roughness: .55, transparent: true, opacity: .9 }),
  shutter: STD({ color: 0x3a3b3d, roughness: .6 }), darkBack: STD({ color: 0x1d1e20, roughness: 1 }),

    list.forEach(([X, y, Z, sx, sy, sz, c], i) => { mx.compose(toV(X, y, Z), q, new THREE.Vector3(sx, sy, sz)); im.setMatrixAt(i, mx); im.setColorAt(i, col.setHex(c)); });
    im.castShadow = true; im.receiveShadow = true; g.add(im);
  };
  put(shrubs, new THREE.IcosahedronGeometry(1, 2), 0.9); put(flowers, new THREE.IcosahedronGeometry(1, 1), 0.6);
}

function buildLot() {
  const g = new THREE.Group(); g.name = 'Terreno';
  box(g, LOT_X0, LOT_X1, -0.04, 0, LOT_Z0, LOT_Z1, M.grass, { cast: false });
  if (REFORM) box(g, 7.35, GX1, 0, 0.015, LOT_Z0, -1.2, M.gravel, { cast: false }); // acesso de carro até o pórtico
  else box(g, 8.0, GX1, 0, 0.015, LOT_Z0, 5.5, M.gravel, { cast: false });
  poly(g, [[2.75, -4.5], [3.65, -4.5], [5.25, -0.55], [4.35, -0.55]], 0, 0.04, M.concrete);
  box(g, LOT_X0, LOT_X1, 0, 0.10, -6.5, LOT_Z0, M.concrete, { cast: false });
  box(g, -12, 21, -0.10, 0.12, -6.65, -6.5, M.concrete, { cast: false });
  box(g, -12, 21, -0.12, -0.10, -14, -6.65, M.asphalt, { cast: false });
  // muros de divisa (laterais e fundos); na reforma a parede da garagem substitui o trecho do muro da direita
  const MH = 1.80;
  box(g, LOT_X0, LOT_X0 + 0.15, 0, MH, LOT_Z0, ANX_Z0, M.block); // nos fundos as paredes da construção fazem a divisa
  if (REFORM) { box(g, GX1, LOT_X1, 0, MH, LOT_Z0, GPZ, M.block); box(g, GX1, LOT_X1, 0, MH, GZ1, ANX_Z0, M.block); }
  else box(g, GX1, LOT_X1, 0, MH, LOT_Z0, ANX_Z0, M.block);
  // muro frontal: base, pilares de bloco e grade branca (na reforma o pilar se alinha ao portão da garagem)
  box(g, LOT_X0, LOT_X1, 0, 0.22, -4.58, -4.42, M.concrete);
  const pil = [LOT_X0 + 0.13, 0.75, 2.65, 3.75, REFORM ? 7.65 : 8.4, LOT_X1 - 0.13];
  for (const x of pil) { box(g, x - 0.13, x + 0.13, 0, 1.85, -4.63, -4.37, M.block); box(g, x - 0.16, x + 0.16, 1.85, 1.92, -4.66, -4.34, M.white); }
  const bars = [], rails = [];
  for (let i = 0; i < pil.length - 1; i++) {
    const s0 = pil[i] + 0.13, s1 = pil[i + 1] - 0.13; rails.push([s0, s1]);
    for (let x = s0 + 0.06; x < s1 - 0.03; x += 0.105) bars.push(x);
  }
  const bg = new THREE.BoxGeometry(0.022, 1.48, 0.022), im = new THREE.InstancedMesh(bg, M.bar, bars.length), mx = new THREE.Matrix4();
  bars.forEach((x, i) => { mx.makeTranslation(x - CX, 0.22 + 0.74, CZ + 4.5); im.setMatrixAt(i, mx); });
  im.castShadow = true; g.add(im);
  for (const [s0, s1] of rails) for (const y of [0.36, 1.58]) box(g, s0, s1, y, y + 0.04, -4.515, -4.485, M.bar);
  box(g, 3.62, 3.64, 1.0, 1.12, -4.56, -4.53, M.darkBack);
  if (REFORM) buildGarden(g);
  return g;
}

// ---------------- Cena
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
view.appendChild(renderer.domElement);
const labelR = new CSS2DRenderer(); labelR.setSize(innerWidth, innerHeight);
Object.assign(labelR.domElement.style, { position: 'fixed', inset: '0', pointerEvents: 'none' }); view.appendChild(labelR.domElement);

const scene = new THREE.Scene();
const sky = document.createElement('canvas'); sky.width = 2; sky.height = 256;
{ const x = sky.getContext('2d'), gr = x.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, '#9fbfdc'); gr.addColorStop(0.65, '#dfe8ef'); gr.addColorStop(1, '#eef1f2'); x.fillStyle = gr; x.fillRect(0, 0, 2, 256); }
scene.background = new THREE.CanvasTexture(sky); scene.background.colorSpace = THREE.SRGBColorSpace;

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 400);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.495; controls.minDistance = 3; controls.maxDistance = 70;
controls.target.set(0, 1.8, 0);

scene.add(new THREE.HemisphereLight(0xe3edf7, 0x6f6a58, 1.35));
const sun = new THREE.DirectionalLight(0xfff6e8, 2.3); sun.position.set(-10, 17, 13); sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -17, right: 17, top: 17, bottom: -17, near: 1, far: 60 });
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

const outside = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), M.outside); outside.rotation.x = -Math.PI / 2; outside.position.y = -0.13; outside.receiveShadow = true; scene.add(outside);
let houseG = null, lotG = null;
const labelG = new THREE.Group(); scene.add(labelG);
function buildLabels() {
  labelG.clear();
  const annex = ['Construção dos fundos', '70 m² (sem planta)', (LOT_X0 + LOT_X1) / 2, (ANX_Z0 + ANX_Z1) / 2];
  const rooms = REFORM ? [...ROOMS, ['Garagem', `${GARAGE_AREA} m²`, (GX0 + GX1) / 2, (GZ0 + GZ1) / 2], annex] : [...ROOMS, annex];
  for (const [n, a, X, Z] of rooms) { const d = document.createElement('div'); d.className = 'room'; d.innerHTML = `<b>${n}</b>${a}`;
    const o = new CSS2DObject(d); o.position.copy(toV(X, FL + 0.1, Z)); labelG.add(o); }
}

const state = { model: 1, view: 'ext', lot: true, labels: true, project: 'reforma' };
const CUTS = { ext: Infinity, roof: CEIL, plan: 1.30 };
function disposeGroup(g) { g.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
async function rebuild() {
  PHOTO = state.model === 2; CUT = CUTS[state.view]; REFORM = state.project === 'reforma';
  if (PHOTO) await loadPhotoTextures();
  applyPaint(); document.getElementById('paint').hidden = !REFORM;
  if (houseG) { scene.remove(houseG); disposeGroup(houseG); }
  houseG = buildHouse(); scene.add(houseG);
  if (lotG) { scene.remove(lotG); disposeGroup(lotG); }
  lotG = buildLot(); lotG.visible = state.lot; scene.add(lotG);
  buildLabels(); labelG.visible = state.labels && state.view !== 'ext';
  const base = PHOTO
    ? 'Mesma geometria da planta, com as suas fotos aplicadas nas fachadas. A lateral esquerda e o volume alto quase não aparecem nas fotos, então ficaram com textura de reboco genérica.'
    : 'Geometria da planta baixa, com alturas estimadas pelas fotos (platibanda ~4,40 m; volume do quarto dos fundos ~5,85 m). Materiais simplificados.';
  const annexNote = ' Construção dos fundos (existente, sem planta): 14 × 5 m, encostada no fundo e nas laterais do lote, a 5 m da casa, com telhado de fibrocimento em uma água; medidas das aberturas estimadas pela foto.';
  document.getElementById('note').textContent = (REFORM
    ? `Reforma: garagem fechada de ${(GX1 - GX0).toFixed(2).replace('.', ',')} × ${(GZ1 - GZ0 - 0.30).toFixed(2).replace('.', ',')} m internos (${GARAGE_AREA} m²), da lateral da casa até o muro, da frente da sala até o fim da área dos fundos. Altura 3,23 m, na linha do friso. Portões de 3,10 × 2,40 m na frente e nos fundos. Área dos fundos, entre a casa e a garagem, coberta com policarbonato transparente (3,05 a 2,80 m, caindo para os fundos). Fachada em chumbo em duas partes: na garagem, faixa de 40 cm (2,83 a 3,23 m, na linha da garagem) da sala até o muro, rente à frente da casa; no quarto da frente, avançando 40 cm, pilar esquerdo até o chão e faixa horizontal de 40 cm (4,00 a 4,40 m) do quarto até o fim da sala. Pedra ferro escura nas faces internas dos pilares. Coberturas planas em chumbo sobre as janelas laterais do quarto dos fundos e da suíte, 30 cm maiores de cada lado e com 60 cm de balanço. Casa e garagem pintadas de cinza (dá para testar outras cores em "Cores da pintura"). Varal de lâmpadas amarelas em zigue-zague no quintal, entre a casa e a construção dos fundos. Canteiros com arbustos e flores junto aos muros laterais e ao muro da frente.` + base
    : 'Situação atual. ' + base) + annexNote;
}

// câmera
const CAMS = { iso: [-11, 8, 16], front: [0, 3.2, 21], back: [7, 9, -14], left: [-19, 5, 1], right: [19, 5, 1], top: [0.01, 27, 1.5] };
let tween = null;
function goCam(name) { const to = new THREE.Vector3(...CAMS[name]); tween = { p0: camera.position.clone(), p1: to, t0: performance.now(), dur: 700 }; }
camera.position.set(...CAMS.iso);

// UI
function seg(id, key, after) {
  const el = document.getElementById(id);
  el.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
    el.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    state[key] = isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v; rebuild().then(after); });
}
seg('projSeg', 'project');
seg('modelSeg', 'model');
seg('viewSeg', 'view', () => { if (state.view === 'plan' && camera.position.y < 10) goCam('top'); });
// Cores da pintura: seletor livre + sugestões; fica salvo neste navegador e pode ir no link (?parede=…&detalhes=…)
{
  const KEY = 'casa3d-pintura', isHex = v => /^#[0-9a-f]{6}$/i.test(v || '');
  try { const saved = JSON.parse(localStorage.getItem(KEY) || '{}'); for (const k of ['wall', 'trim']) if (isHex(saved[k])) PAINT[k] = saved[k]; } catch (e) {}
  const q = new URLSearchParams(location.search);
  for (const [k, p] of [['wall', 'parede'], ['trim', 'detalhes']]) { const v = '#' + (q.get(p) || ''); if (isHex(v)) PAINT[k] = v.toLowerCase(); }
  const sync = () => {
    for (const k of ['wall', 'trim']) {
      document.getElementById('pick-' + k).value = PAINT[k];
      const hx = document.getElementById('hex-' + k); if (document.activeElement !== hx) { hx.value = PAINT[k].toUpperCase(); hx.classList.remove('bad'); }
      const hit = PAINT_PRESETS[k].find(([, h]) => h === PAINT[k]);
      document.getElementById('name-' + k).textContent = (hit ? hit[0] + ' · ' : '') + PAINT[k].toUpperCase();
      document.querySelectorAll(`#sw-${k} button`).forEach(b => b.classList.toggle('on', b.dataset.c === PAINT[k]));
    }
  };
  const set = (k, hex) => { PAINT[k] = hex.toLowerCase(); applyPaint(); sync(); try { localStorage.setItem(KEY, JSON.stringify(PAINT)); } catch (e) {} };
  for (const k of ['wall', 'trim']) {
    const sw = document.getElementById('sw-' + k);
    sw.innerHTML = PAINT_PRESETS[k].map(([n, h]) => `<button data-c="${h}" title="${n}" aria-label="${n}" style="background:${h}"></button>`).join('');
    sw.addEventListener('click', e => { const b = e.target.closest('button'); if (b) set(k, b.dataset.c); });
    document.getElementById('pick-' + k).addEventListener('input', e => set(k, e.target.value));
    // código digitado à mão: aceita RRGGBB ou RGB, com ou sem #
    const hx = document.getElementById('hex-' + k), parse = v => { v = v.trim().replace(/^#/, '');
      if (/^[0-9a-f]{3}$/i.test(v)) v = v.replace(/./g, c => c + c); return /^[0-9a-f]{6}$/i.test(v) ? '#' + v : null; };
    hx.addEventListener('input', () => { const h = parse(hx.value); hx.classList.toggle('bad', !h && hx.value.trim().length > 0); if (h && hx.value.replace('#', '').length === 6) set(k, h); });
    hx.addEventListener('change', () => { const h = parse(hx.value); if (h) set(k, h); hx.value = PAINT[k].toUpperCase(); hx.classList.remove('bad'); });
    hx.addEventListener('keydown', e => { if (e.key === 'Enter') hx.blur(); });
  }
  document.getElementById('paintReset').onclick = () => { set('wall', PAINT_DEFAULT.wall); set('trim', PAINT_DEFAULT.trim); };
  document.getElementById('paintLink').onclick = async e => {
    const u = new URL(location.href); u.searchParams.set('parede', PAINT.wall.slice(1)); u.searchParams.set('detalhes', PAINT.trim.slice(1));
    try { await navigator.clipboard.writeText(u.href); e.target.textContent = 'Link copiado'; } catch (err) { prompt('Copie o link com estas cores:', u.href); }
    setTimeout(() => { e.target.textContent = 'Copiar link com estas cores'; }, 2000);
  };
  sync();
}
document.querySelectorAll('[data-cam]').forEach(b => b.onclick = () => goCam(b.dataset.cam));
document.getElementById('lot').onchange = e => { state.lot = e.target.checked; lotG.visible = state.lot; };
document.getElementById('labels').onchange = e => { state.labels = e.target.checked; labelG.visible = state.labels && state.view !== 'ext'; };
document.getElementById('toggle').onclick = () => document.getElementById('panel').classList.toggle('collapsed');
if (innerWidth <= 600) document.getElementById('panel').classList.add('collapsed');
document.getElementById('export').onclick = () => {
  const root = new THREE.Group(); root.add(houseG.clone()); if (state.lot) root.add(lotG.clone());
  new GLTFExporter().parse(root, buf => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf], { type: 'model/gltf-binary' }));
    a.download = `casa-${REFORM ? 'reforma-garagem' : 'atual'}-modelo-${state.model}${PHOTO ? '-fotos' : ''}.glb`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }, err => alert('Não foi possível exportar: ' + err), { binary: true });
};
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labelR.setSize(innerWidth, innerHeight); });

function loop(now) {
  requestAnimationFrame(loop);
  if (tween) { const k = Math.min(1, (now - tween.t0) / tween.dur), e = k * k * (3 - 2 * k);
    camera.position.lerpVectors(tween.p0, tween.p1, e); if (k >= 1) tween = null; }
  controls.update(); renderer.render(scene, camera); labelR.render(scene, camera);
}
const start = new URLSearchParams(location.search);
if (start.get('model') === '2') { state.model = 2; document.querySelectorAll('#modelSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === '2')); }
if (start.get('projeto') === 'atual') { state.project = 'atual'; document.querySelectorAll('#projSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === 'atual')); }
rebuild().then(() => { document.getElementById('loading').remove(); requestAnimationFrame(loop); });
window.__casa = { state, rebuild, goCam, camera, controls, renderer, scene, labelG };
</script>
